<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rent Room Finder</title>
  <style>
    :root {
      --bg-color: #f4f4f9;
      --card-bg: #ffffff;
      --text-color: #333333;
    }

    body.dark-mode {
      --bg-color: #1e1e2f;
      --card-bg: #2d2d44;
      --text-color: #ffffff;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 0;
      transition: background 0.3s, color 0.3s;
    }

    /* Header & Logo */
    header {
      background: #007bff;
      color: white;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-container h1 {
      margin: 0;
      font-size: 22px;
    }

    .theme-btn {
      background: white;
      color: #007bff;
      border: none;
      padding: 8px 12px;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
    }

    /* Search & Filter Box */
    .search-box {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin: 25px auto;
      flex-wrap: wrap;
      max-width: 900px;
      padding: 0 10px;
    }

    .search-box input, .search-box select, .search-box button {
      padding: 10px 15px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    .btn-search {
      background-color: #007bff;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-reset {
      background-color: #6c757d;
      color: white;
      border: none;
      cursor: pointer;
    }

    /* Cards Layout */
    .property-container {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
      padding: 20px;
    }

    .card {
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      overflow: hidden;
      width: 260px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      background: var(--card-bg);
      text-align: left;
    }

    .card img {
      width: 100%;
      height: 160px;
      object-fit: cover;
    }

    .card-details {
      padding: 15px;
    }

    .card-details h3 {
      margin: 0 0 10px 0;
      font-size: 18px;
    }

    .price {
      color: #28a745;
      font-weight: bold;
      font-size: 1.1em;
    }

    .amenities {
      display: flex;
      gap: 5px;
      margin: 10px 0;
      flex-wrap: wrap;
    }

    .tag {
      background: #e9ecef;
      color: #495057;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 12px;
    }

    .book-btn {
      width: 100%;
      padding: 10px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
    }

    /* Modal Styling */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: white;
      color: #333;
      padding: 20px;
      border-radius: 8px;
      width: 320px;
      position: relative;
    }

    .close-btn {
      position: absolute;
      right: 15px;
      top: 10px;
      cursor: pointer;
      font-size: 20px;
    }
  </style>
</head>
<body>

  <!-- Header Section with Logo -->
  <header>
    <div class="logo-container">
      🏠
      <h1>Rent Room Finder</h1>
    </div>
    <button class="theme-btn" onclick="toggleTheme()">🌙 Dark Mode</button>
  </header>

  <!-- Search & Filter Controls -->
  <div class="search-box">
    <input type="text" id="locationInput" placeholder="Location (e.g. Andheri, Pune)">
    
    <select id="typeSelect">
      <option value="">All Property Types</option>
      <option value="Room">Room</option>
      <option value="PG">PG</option>
      <option value="1 BHK">1 BHK</option>
      <option value="2 BHK">2 BHK</option>
    </select>

    <select id="priceSelect">
      <option value="">All Prices</option>
      <option value="15000">Under ₹15,000</option>
      <option value="30000">Under ₹30,000</option>
      <option value="50000">Under ₹50,000</option>
    </select>

    <button type="button" class="btn-search" onclick="searchProperties()">Search</button>
    <button type="button" class="btn-reset" onclick="resetFilters()">Reset</button>
  </div>

  <!-- Listings Display -->
  <div class="property-container" id="propertyList"></div>

  <!-- Pop-up Modal -->
  <div id="contactModal" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal()">&times;</span>
      <h3 id="modalTitle"></h3>
      <p id="modalLocation"></p>
      <p id="modalPrice" class="price"></p>
      <hr>
      <form onsubmit="handleInquiry(event)">
        <input type="text" placeholder="Your Name" required style="width:90%; padding:8px; margin:5px 0;">
        <input type="tel" placeholder="Your Phone Number" required style="width:90%; padding:8px; margin:5px 0;">
        <button type="submit" style="width:98%; padding:10px; background:#28a745; color:white; border:none; border-radius:4px; margin-top:10px; cursor:pointer;">Send Inquiry</button>
      </form>
    </div>
  </div>

  <script>
    const properties = [
      {
        title: "1 BHK Modern Apartment",
        location: "Andheri West, Mumbai",
        type: "1 BHK",
        priceNum: 28000,
        price: "₹28,000 / month",
        tags: ["Wi-Fi", "AC", "Parking"],
        image: "https://images.unsplash.com/photo-1522708323590-d24dbb6b0267?w=400"
      },
      {
        title: "Luxury 2 BHK Flat",
        location: "Malad West, Mumbai",
        type: "2 BHK",
        priceNum: 38000,
        price: "₹38,000 / month",
        tags: ["Fully Furnished", "Gym"],
        image: "https://images.unsplash.com/photo-1502672260266-1c1ef2d93688?w=400"
      },
      {
        title: "Student Friendly AC PG",
        location: "Kothrud, Pune",
        type: "PG",
        priceNum: 8500,
        price: "₹8,500 / month",
        tags: ["Meals Included", "Wi-Fi"],
        image: "https://images.unsplash.com/photo-1555854877-bab0e564b8d5?w=400"
      },
      {
        title: "Private Single Room",
        location: "Viman Nagar, Pune",
        type: "Room",
        priceNum: 12000,
        price: "₹12,000 / month",
        tags: ["AC", "Attached Bath"],
        image: "https://images.unsplash.com/photo-1598928506311-c55ded91a20c?w=400"
      }
    ];

    function displayProperties(list) {
      const container = document.getElementById("propertyList");
      container.innerHTML = "";

      if (list.length === 0) {
        container.innerHTML = "<p>No properties found!</p>";
        return;
      }

      list.forEach(prop => {
        const tagHTML = prop.tags.map(t => `<span class="tag">${t}</span>`).join("");
        container.innerHTML += `
          <div class="card">
            <img src="${prop.image}" alt="${prop.title}">
            <div class="card-details">
              <h3>${prop.title}</h3>
              <p><strong>Location:</strong> ${prop.location}</p>
              <div class="amenities">${tagHTML}</div>
              <p class="price">${prop.price}</p>
              <button class="book-btn" onclick="openModal('${prop.title}', '${prop.location}', '${prop.price}')">Contact Owner</button>
            </div>
          </div>
        `;
      });
    }

    function searchProperties() {
      const locVal = document.getElementById("locationInput").value.toLowerCase().trim();
      const typeVal = document.getElementById("typeSelect").value;
      const priceVal = document.getElementById("priceSelect").value;

      const filtered = properties.filter(prop => {
        const matchLoc = prop.location.toLowerCase().includes(locVal);
        const matchType = typeVal === "" || prop.type === typeVal;
        const matchPrice = priceVal === "" || prop.priceNum <= parseInt(priceVal);
        return matchLoc && matchType && matchPrice;
      });

      displayProperties(filtered);
    }

    function resetFilters() {
      document.getElementById("locationInput").value = "";
      document.getElementById("typeSelect").value = "";
      document.getElementById("priceSelect").value = "";
      displayProperties(properties);
    }

    function toggleTheme() {
      document.body.classList.toggle("dark-mode");
    }

    function openModal(title, location, price) {
      document.getElementById("modalTitle").innerText = title;
      document.getElementById("modalLocation").innerText = "Location: " + location;
      document.getElementById("modalPrice").innerText = price;
      document.getElementById("contactModal").style.display = "flex";
    }

    function closeModal() {
      document.getElementById("contactModal").style.display = "none";
    }

    function handleInquiry(e) {
      e.preventDefault();
      alert("Inquiry Sent Successfully!");
      closeModal();
    }

    displayProperties(properties);
  </script>
</body>
</html>
