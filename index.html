<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Priya House - Rent Room Finder</title>
  <style>
    :root { --bg-color: #f4f4f9; --card-bg: #ffffff; --text-color: #333333; }
    body.dark-mode { --bg-color: #1e1e2f; --card-bg: #2d2d44; --text-color: #ffffff; }
    body { font-family: Arial, sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 20px; transition: 0.3s; }
    
    .theme-btn { background: white; color: #007bff; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer; font-weight: bold; }
    .section-box { background: var(--card-bg); padding: 20px; margin: 20px 0; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .filter-group { margin-bottom: 15px; }
    label { font-weight: bold; display: block; margin-bottom: 5px; }
    select, input[type="text"], input[type="tel"], input[type="number"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; margin-bottom: 10px; }
    
    .btn-submit { background-color: #28a745; color: white; padding: 10px 15px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; width: 100%; font-size: 16px; }
    .property-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-top: 20px; }
    .room-card { background: var(--card-bg); padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: flex; flex-direction: column; justify-content: space-between; }
    .room-card img { width: 100%; height: 180px; object-fit: cover; border-radius: 6px; }
    
    .tag { background: #e0e0e0; color: #333; padding: 3px 8px; border-radius: 4px; font-size: 12px; margin-right: 5px; display: inline-block; margin-top: 5px; }
    .btn-call { background-color: #007bff; color: white; padding: 8px 12px; text-decoration: none; border-radius: 5px; font-weight: bold; display: inline-block; margin-top: 10px; text-align: center; }
    .btn-whatsapp { background-color: #25D366; color: white; padding: 8px 12px; text-decoration: none; border-radius: 5px; font-weight: bold; display: inline-block; margin-top: 10px; text-align: center; }
  </style>
</head>
<body>

  <!-- Header Section -->
  <header style="display: flex; align-items: center; justify-content: space-between; background: #007bff; color: white; padding: 15px 20px; border-radius: 8px;">
    <div style="display: flex; align-items: center; gap: 12px;">
      <img src="https://images.jdmagicbox.com/v2/comp/bangalore/t2/080pxx80.xx80.230703183630.i6t2/catalogue/house-of-priya-lifestyle-basavanagudi-bangalore-modular-kitchen-manufacturers-in63s96fr6-250.jpg" alt="Priya House Logo" style="height: 45px; width: 45px; border-radius: 50%; object-fit: cover; border: 2px solid white;">
      <h1 style="margin: 0; font-size: 22px;">Priya House - Rent Room Finder</h1>
    </div>
    <button class="theme-btn" onclick="document.body.classList.toggle('dark-mode')">🌙 Dark Mode</button>
  </header>

  <!-- Real Property Form -->
  <div class="section-box" style="border: 2px solid #28a745;">
    <h2 style="color: #28a745; margin-top: 0;">🏠 List Your Property / Post Room (Free)</h2>
    <form id="addRoomForm">
      <label>Your Name:</label>
      <input type="text" id="ownerName" placeholder="Enter full name" required>

      <label>WhatsApp / Phone Number:</label>
      <input type="tel" id="ownerPhone" placeholder="Enter 10-digit mobile number" required>

      <label>Location (e.g. Malad West, Dadar, Thane):</label>
      <input type="text" id="roomLoc" placeholder="e.g. Malad West, Mumbai" required>

      <label>Category:</label>
      <select id="roomCat">
        <option value="Single Room">Single Room</option>
        <option value="1 BHK">1 BHK</option>
        <option value="2 BHK">2 BHK</option>
        <option value="PG / Hostel">PG / Hostel</option>
      </select>

      <label>Monthly Rent (₹):</label>
      <input type="number" id="roomPrice" placeholder="e.g. 12000" required>

      <button type="submit" class="btn-submit">➕ Submit Room Listing</button>
    </form>
  </div>

  <!-- Search & Filter Section -->
  <div class="section-box">
    <h2>Search Rooms, PGs & Apartments</h2>
    <div class="filter-group">
      <label>Location / Area:</label>
      <input type="text" id="searchInput" onkeyup="filterProperties()" placeholder="Type Malad, Borivali, Dadar, Thane, Vashi...">
    </div>

    <div class="filter-group">
      <label>Room Category:</label>
      <select id="categorySelect" onchange="filterProperties()">
        <option value="All">All Types</option>
        <option value="Single Room">Single Room</option>
        <option value="1 BHK">1 BHK</option>
        <option value="2 BHK">2 BHK</option>
        <option value="PG / Hostel">PG / Hostel</option>
      </select>
    </div>
  </div>

  <!-- Available Rooms Section -->
  <h2>Available Properties (<span id="count">0</span>)</h2>
  <div class="property-grid" id="propertyContainer"></div>

  <script>
    // WESTERN, CENTRAL & HARBOUR LINE MUMBAI LOCATIONS
    const locations = [
      // Western Line
      "Malad West, Mumbai", "Malad East, Mumbai", "Andheri West, Mumbai", "Andheri East, Mumbai", 
      "Borivali West, Mumbai", "Borivali East, Mumbai", "Goregaon West, Mumbai", "Goregaon East, Mumbai", 
      "Bandra West, Mumbai", "Kandivali West, Mumbai", "Dadar West, Mumbai", "Vasai West, Mumbai",
      // Central Line
      "Thane West, Mumbai", "Kalyan West, Mumbai", "Dombivli East, Mumbai", "Ghatkopar East, Mumbai", 
      "Kurla West, Mumbai", "Mulund West, Mumbai", "Bhandup West, Mumbai",
      // Harbour Line
      "Vashi, Navi Mumbai", "Nerul, Navi Mumbai", "Panvel, Navi Mumbai", "Belapur, Navi Mumbai"
    ];

    const categories = ["Single Room", "1 BHK", "2 BHK", "PG / Hostel"];
    const images = [
      "https://images.unsplash.com/photo-1598928506311-c55ded91a20c?w=400",
      "https://images.unsplash.com/photo-1502672260266-1c1ef2d93688?w=400",
      "https://images.unsplash.com/photo-1555854877-bab0e564b8d5?w=400",
      "https://images.unsplash.com/photo-1560448204-e02f11c3d0e2?w=400"
    ];

    const properties = [];

    // GENERATE 50,000 MUMBAI PROPERTIES (ALL LINES COVERED)
    for (let i = 1; i <= 50000; i++) {
      const loc = locations[i % locations.length];
      const cat = categories[i % categories.length];
      const img = images[i % images.length];
      const priceVal = (6000 + (i * 150) % 35000);

      properties.push({
        id: i,
        title: `${cat} Option #${i} in ${loc}`,
        location: loc,
        type: cat,
        price: `₹${priceVal.toLocaleString('en-IN')} / month`,
        tags: ["WiFi Available", "24/7 Water", "Near Railway Station"],
        phone: "919876543210",
        image: img
      });
    }

    // Handle User Form Submissions
    document.getElementById('addRoomForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const newProp = {
        id: properties.length + 1,
        title: `${document.getElementById('roomCat').value} by ${document.getElementById('ownerName').value}`,
        location: document.getElementById('roomLoc').value,
        type: document.getElementById('roomCat').value,
        price: `₹${parseInt(document.getElementById('roomPrice').value).toLocaleString('en-IN')} / month`,
        tags: ["Newly Added", "Verified Owner"],
        phone: `91${document.getElementById('ownerPhone').value.replace(/\D/g,'')}`,
        image: "https://images.unsplash.com/photo-1560448204-e02f11c3d0e2?w=400"
      };

      properties.unshift(newProp);
      displayProperties(properties);
      alert("Property Successfully Listed!");
      this.reset();
    });

    function displayProperties(items) {
      const container = document.getElementById("propertyContainer");
      document.getElementById("count").innerText = items.length.toLocaleString('en-IN');
      container.innerHTML = "";

      const displayItems = items.slice(0, 100);

      displayItems.forEach(prop => {
        const tagsHTML = prop.tags.map(t => `<span class="tag">${t}</span>`).join("");
        
        container.innerHTML += `
          <div class="room-card">
            <div>
              <img src="${prop.image}" alt="${prop.title}">
              <h3 style="margin: 10px 0 5px 0; font-size: 16px;">${prop.title}</h3>
              <p style="margin: 5px 0;"><strong>Location:</strong> ${prop.location}</p>
              <p style="margin: 5px 0;"><strong>Category:</strong> ${prop.type}</p>
              <p style="margin: 5px 0;"><strong>Rent:</strong> ${prop.price}</p>
              <div>${tagsHTML}</div>
            </div>
            <div style="display: flex; gap: 10px; margin-top: 15px;">
              <a href="tel:${prop.phone}" class="btn-call" style="flex: 1;">📞 Call</a>
              <a href="https://wa.me/${prop.phone}?text=Hi,%20I%20am%20interested%20in%20${encodeURIComponent(prop.title)}" class="btn-whatsapp" target="_blank" style="flex: 1;">💬 WhatsApp</a>
            </div>
          </div>
        `;
      });
    }

    function filterProperties() {
      const searchVal = document.getElementById("searchInput").value.toLowerCase();
      const catVal = document.getElementById("categorySelect").value;

      const filtered = properties.filter(prop => {
        const matchesSearch = prop.title.toLowerCase().includes(searchVal) || prop.location.toLowerCase().includes(searchVal);
        const matchesCat = (catVal === "All") || (prop.type === catVal);
        return matchesSearch && matchesCat;
      });

      displayProperties(filtered);
    }

    displayProperties(properties);
  </script>

</body>
</html>
